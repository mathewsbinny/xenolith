[package]
name = "xenolith"
description = "Xenolith: desktop GUI for Xbox 360 -> PC asset inspection and batch conversion, built on the Tool Suite Design Language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "xenolith"
path = "src/main.rs"

[features]
default = ["frostbite", "xma"]
frostbite = ["dep:x360-frostbite"]
xma = ["dep:x360-xma"]

[dependencies]
eframe.workspace = true
egui_dock.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

x360-containers.workspace = true
x360-xenos-texture.workspace = true
x360-xenos-shader.workspace = true
x360-havok.workspace = true
x360-granny.workspace = true
x360-frostbite = { workspace = true, optional = true }
x360-xma = { workspace = true, optional = true }

[lints]
workspace = true
